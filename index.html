<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Number - Premium Math Game</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

    <style>
        /* --- CSS STYLING & ANIMATIONS --- */
        :root {
            --primary-blue: #00d2ff;
            --primary-purple: #7928ca;
            --primary-green: #00f2fe;
            --accent-yellow: #ffee58;
            --neon-pink: #ff007f;
            --bg-dark: #0a0a23;
            --card-bg: rgba(255, 255, 255, 0.07);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at center, #1a1a3a 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Floating Particles Background Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: rgba(10, 10, 35, 0.75);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            z-index: 1;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(121, 40, 202, 0.3);
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 480px) {
            .game-container {
                max-height: 100vh;
                border-radius: 0;
            }
        }

        /* Screens Management */
        .screen {
            display: none;
            flex-direction: column;
            padding: 24px;
            flex: 1;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Typography & Glowing Elements */
        h1.logo {
            font-size: 2.8rem;
            text-align: center;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary-blue), var(--primary-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
            margin-top: 40px;
            animation: bounce 2s infinite ease-in-out;
        }

        .subtitle {
            text-align: center;
            color: var(--accent-yellow);
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Buttons & Cards Styling */
        .btn {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-3px);
            border-color: var(--primary-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-purple), #4a148c);
            border: none;
            box-shadow: 0 0 15px rgba(121, 40, 202, 0.4);
        }

        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(121, 40, 202, 0.7);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Selection Cards */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
